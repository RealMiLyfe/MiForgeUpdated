<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d8a6e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Window frame -->
  <rect width="800" height="500" fill="#0d1117" rx="12"/>
  <rect y="0" width="800" height="36" fill="#161b22" rx="12"/>
  <rect y="18" width="800" height="18" fill="#161b22"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
  
  <!-- Title bar -->
  <text x="400" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">MiForge — Spec-Driven Development</text>
  
  <!-- Sidebar -->
  <rect x="0" y="36" width="200" height="464" fill="#161b22"/>
  
  <!-- Sidebar items -->
  <text x="16" y="65" font-family="monospace" font-size="11" fill="#8b949e">📁 .kiro/specs/</text>
  <rect x="8" y="74" width="184" height="24" rx="4" fill="#1f6feb" opacity="0.15"/>
  <text x="28" y="90" font-family="monospace" font-size="11" fill="#58a6ff">📋 requirements.md</text>
  <text x="28" y="112" font-family="monospace" font-size="11" fill="#8b949e">📐 design.md</text>
  <text x="28" y="134" font-family="monospace" font-size="11" fill="#8b949e">✅ tasks.md</text>
  
  <text x="16" y="170" font-family="monospace" font-size="11" fill="#8b949e">📁 scripts/</text>
  <text x="28" y="192" font-family="monospace" font-size="11" fill="#8b949e">🤖 triage_issue.ts</text>
  <text x="28" y="214" font-family="monospace" font-size="11" fill="#8b949e">🔍 detect_duplicates.ts</text>
  <text x="28" y="236" font-family="monospace" font-size="11" fill="#8b949e">🏷️ assign_labels.ts</text>
  <text x="28" y="258" font-family="monospace" font-size="11" fill="#8b949e">🧹 close_stale.ts</text>
  
  <!-- Main content area -->
  <rect x="200" y="36" width="600" height="464" fill="#0d1117"/>
  
  <!-- Spec content -->
  <text x="220" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">Requirements: Issue Automation</text>
  
  <!-- Requirement cards -->
  <rect x="220" y="85" width="560" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="236" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff">Requirement 1: Automatic Label Assignment</text>
  <text x="236" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">As a maintainer, I want issues auto-labeled so I can quickly</text>
  <text x="236" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">identify and prioritize without manual categorization.</text>
  <rect x="236" y="152" width="60" height="16" rx="8" fill="#238636" opacity="0.3"/>
  <text x="266" y="163" font-family="monospace" font-size="9" fill="#3fb950" text-anchor="middle">✓ Done</text>
  
  <rect x="220" y="185" width="560" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="236" y="208" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff">Requirement 2: Duplicate Detection</text>
  <text x="236" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">As a maintainer, I want duplicates auto-identified so I can</text>
  <text x="236" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">consolidate discussions and avoid fragmentation.</text>
  <rect x="236" y="252" width="60" height="16" rx="8" fill="#238636" opacity="0.3"/>
  <text x="266" y="263" font-family="monospace" font-size="9" fill="#3fb950" text-anchor="middle">✓ Done</text>
  
  <rect x="220" y="285" width="560" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="236" y="308" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff">Requirement 3: Stale Issue Management</text>
  <text x="236" y="328" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">As a maintainer, I want stale issues auto-closed after 7 days</text>
  <text x="236" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">so the tracker stays focused on actionable items.</text>
  <rect x="236" y="352" width="60" height="16" rx="8" fill="#238636" opacity="0.3"/>
  <text x="266" y="363" font-family="monospace" font-size="9" fill="#3fb950" text-anchor="middle">✓ Done</text>
  
  <!-- Bottom status bar -->
  <rect x="200" y="470" width="600" height="30" fill="#161b22"/>
  <text x="216" y="489" font-family="monospace" font-size="10" fill="#3fb950">● Connected to AWS Bedrock</text>
  <text x="540" y="489" font-family="monospace" font-size="10" fill="#8b949e">TypeScript • 12 modules</text>
</svg>
