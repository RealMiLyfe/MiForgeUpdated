<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="triageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d8a6e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Window frame -->
  <rect width="800" height="450" fill="#0d1117" rx="12"/>
  <rect y="0" width="800" height="36" fill="#161b22" rx="12"/>
  <rect y="18" width="800" height="18" fill="#161b22"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
  
  <text x="400" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">GitHub Issues — AI-Powered Triage</text>
  
  <!-- Issue header -->
  <rect x="24" y="50" width="752" height="60" rx="8" fill="#161b22"/>
  <circle cx="50" cy="80" r="12" fill="#238636"/>
  <text x="50" y="84" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle">!</text>
  <text x="72" y="75" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Chat autocomplete not working on macOS Sonoma</text>
  <text x="72" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">#247 opened 2 minutes ago by @developer42</text>
  
  <!-- Labels -->
  <rect x="24" y="120" width="752" height="44" rx="8" fill="#161b22"/>
  <text x="40" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Labels:</text>
  
  <rect x="92" y="132" width="90" height="22" rx="11" fill="#1f6feb" opacity="0.2" stroke="#1f6feb" stroke-width="1"/>
  <text x="137" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">autocomplete</text>
  
  <rect x="192" y="132" width="55" height="22" rx="11" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="1"/>
  <text x="219" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#a371f7" text-anchor="middle">chat</text>
  
  <rect x="257" y="132" width="65" height="22" rx="11" fill="#f78166" opacity="0.2" stroke="#f78166" stroke-width="1"/>
  <text x="289" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#f78166" text-anchor="middle">os: mac</text>
  
  <rect x="332" y="132" width="100" height="22" rx="11" fill="#d29922" opacity="0.2" stroke="#d29922" stroke-width="1"/>
  <text x="382" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#d29922" text-anchor="middle">pending-triage</text>
  
  <!-- AI Comment -->
  <rect x="24" y="176" width="752" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <!-- Bot avatar -->
  <rect x="40" y="192" width="32" height="32" rx="16" fill="url(#triageGrad)"/>
  <text x="56" y="213" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">🤖</text>
  
  <text x="82" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#e6edf3">MiForge Bot</text>
  <text x="178" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">commented 1 minute ago</text>
  
  <!-- Bot message -->
  <text x="44" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#e6edf3">Thank you for reporting this issue! 🙏</text>
  <text x="44" y="262" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">We can see you're experiencing autocomplete problems in the chat</text>
  <text x="44" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">interface on macOS Sonoma. A maintainer will look into this shortly.</text>
  <text x="44" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">We appreciate your contribution to making MiForge better! 💪</text>
  
  <rect x="44" y="320" width="200" height="22" rx="4" fill="#0d5c6e" opacity="0.2"/>
  <text x="54" y="335" font-family="monospace" font-size="10" fill="#4db6ac">🏷️ Auto-classified via AWS Bedrock</text>
  
  <!-- Workflow indicator -->
  <rect x="24" y="370" width="752" height="60" rx="8" fill="#0d2818" stroke="#238636" stroke-width="1"/>
  <text x="44" y="395" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#3fb950">✓ Issue Triage Workflow — Completed in 12s</text>
  <text x="44" y="415" font-family="monospace" font-size="11" fill="#8b949e">Classification: 94% confidence • Duplicates: None found • Labels: 4 applied</text>
</svg>
