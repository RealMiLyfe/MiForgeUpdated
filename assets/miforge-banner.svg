<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#0d5c6e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0a6e5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d8a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d8a6e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="#0d1117" rx="16"/>
  
  <!-- Forge Icon -->
  <g transform="translate(60, 70)" filter="url(#shadow)">
    <!-- Anvil shape -->
    <path d="M20 120 L140 120 L150 140 L10 140 Z" fill="url(#iconGradient)" opacity="0.9"/>
    <rect x="50" y="100" width="60" height="20" rx="4" fill="url(#iconGradient)"/>
    <!-- Hammer -->
    <rect x="70" y="30" width="12" height="70" rx="3" fill="#4db6ac" transform="rotate(-15, 76, 65)"/>
    <rect x="55" y="15" width="42" height="22" rx="5" fill="url(#brandGradient)" transform="rotate(-15, 76, 26)"/>
    <!-- Sparks -->
    <circle cx="45" cy="85" r="3" fill="#4db6ac" opacity="0.8"/>
    <circle cx="35" cy="75" r="2" fill="#80cbc4" opacity="0.6"/>
    <circle cx="50" cy="70" r="2.5" fill="#4db6ac" opacity="0.7"/>
    <circle cx="115" cy="80" r="2.5" fill="#4db6ac" opacity="0.7"/>
    <circle cx="125" cy="70" r="2" fill="#80cbc4" opacity="0.6"/>
  </g>
  
  <!-- MiLyfe text -->
  <text x="230" y="145" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="url(#brandGradient)">
    Mi<tspan fill="#4db6ac">Lyfe</tspan>
  </text>
  
  <!-- Colon separator -->
  <text x="530" y="145" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="300" fill="#4db6ac">:</text>
  
  <!-- MiForge text -->
  <text x="570" y="145" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="url(#brandGradient)">
    Mi<tspan fill="#0d8a6e">Forge</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="230" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#8b949e">
    Spec-Driven AI Development • From Prototype to Production
  </text>
  
  <!-- Version badge -->
  <rect x="230" y="220" width="80" height="28" rx="14" fill="#1a237e" opacity="0.6"/>
  <text x="270" y="239" font-family="monospace" font-size="13" fill="#4db6ac" text-anchor="middle">v1.0.0</text>
  
  <!-- Platform badges -->
  <rect x="325" y="220" width="70" height="28" rx="14" fill="#0d5c6e" opacity="0.4"/>
  <text x="360" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#80cbc4" text-anchor="middle">macOS</text>
  
  <rect x="405" y="220" width="75" height="28" rx="14" fill="#0d5c6e" opacity="0.4"/>
  <text x="442" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#80cbc4" text-anchor="middle">Windows</text>
  
  <rect x="490" y="220" width="60" height="28" rx="14" fill="#0d5c6e" opacity="0.4"/>
  <text x="520" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#80cbc4" text-anchor="middle">Linux</text>
</svg>
