<!DOCTYPE html>
<html>
<head>
  <title>MiForge — Puter.js AI Chat</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 20px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 12px; }
    header img { width: 32px; height: 32px; border-radius: 8px; }
    header h1 { font-size: 16px; font-weight: 600; }
    header select { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .user { background: #1a237e; margin-left: auto; border-bottom-right-radius: 4px; }
    .assistant { background: #161b22; border: 1px solid #30363d; border-bottom-left-radius: 4px; }
    .system { background: #0d2818; border: 1px solid #238636; font-size: 12px; text-align: center; align-self: center; color: #3fb950; }
    #input-row { display: flex; padding: 12px 20px; gap: 8px; border-top: 1px solid #30363d; }
    input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; font-size: 14px; outline: none; }
    input:focus { border-color: #0d8a6e; }
    button { padding: 12px 24px; border-radius: 10px; border: none; background: linear-gradient(135deg, #1a237e, #0d8a6e); color: white; font-weight: 600; cursor: pointer; font-size: 14px; }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { opacity: 0.6; font-style: italic; }
    #cost { position: fixed; top: 12px; right: 20px; font-size: 11px; color: #3fb950; background: #0d2818; padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>🔨 MiForge Chat</h1>
    <select id="model-select">
      <option value="claude-opus-5">Claude Opus 5 (Flagship)</option>
      <option value="claude-sonnet-5">Claude Sonnet 5 (Code)</option>
      <option value="claude-haiku-4-5" selected>Claude Haiku 4.5 (Fast)</option>
      <option value="gpt-5-vision">GPT-5 Vision</option>
      <option value="o3">o3 (Reasoning)</option>
      <option value="gemini-2.5-flash">Gemini Flash (Long)</option>
    </select>
  </header>
  <div id="cost">💰 Dev cost: $0.00</div>
  <div id="chat">
    <div class="msg system">MiForge AI ready. Powered by Puter.js — you use your own account, developer pays $0.</div>
  </div>
  <div id="input-row">
    <input id="msg" placeholder="Ask MiForge anything..." autofocus />
    <button id="send-btn" onclick="send()">Send</button>
  </div>
  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('msg');
    const btnEl = document.getElementById('send-btn');
    const modelEl = document.getElementById('model-select');

    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

    async function send() {
      const msg = inputEl.value.trim();
      if (!msg) return;
      inputEl.value = '';
      btnEl.disabled = true;

      addMsg('user', msg);
      const el = addMsg('assistant', '');
      el.classList.add('typing');
      el.textContent = '●●●';

      try {
        const model = modelEl.value;
        const stream = await puter.ai.chat(msg, { model, stream: true });
        el.classList.remove('typing');
        el.textContent = '';
        for await (const chunk of stream) {
          el.textContent += chunk?.text || '';
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      } catch (err) {
        el.classList.remove('typing');
        el.textContent = `Error: ${err.message || 'Failed to get response'}`;
        el.style.color = '#f85149';
      }

      btnEl.disabled = false;
      inputEl.focus();
    }

    function addMsg(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
